name: Build 25.12.x QEMU-armsr-armv8
# 你可以理解为这是一种ARM64平台下通用型OpenWrt
# 产出与官方 ImmortalWrt armsr/armv8 相同的组合镜像:
#   squashfs-combined-efi.img.gz
#   squashfs-combined-efi.qcow2 / .vmdk (未压缩)
#   ext4-combined-efi.qcow2.gz / .vmdk.gz
# 比如斐讯N1刷了armbian系统,armbian系统里安装了PVE虚拟机 可用
# 比如新款Apple Silicon芯片的苹果电脑里的虚拟机UTM 可用
# 比如友善NanoPi R3S、R5S 官方推出的预装了PVE的debian系统 可用
# 比如瑞莎E20C刷了Armbian系统，自己安装了QEMU+KVM虚拟机 可用
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
      profile:
        type: choice
        description: |
          可用于ARM64虚拟机(比如macOS下的UTM虚拟机 比如斐讯N1/R3S/R5S等arm64系统的PVE虚拟机)
        options:
          - generic
        required: true
        default: 'generic'
      custom_router_ip:
        description: "请设置管理地址(仅对多网口有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
      rootfs_partsize:
        description: '设置软件包大小 单位(MB) 最大数值10240'
        required: true
        default: '2048'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: |
          chmod +x ${{ github.workspace }}/armsr-armv8/build.sh
          chmod +x ${{ github.workspace }}/armsr-armv8/prepare-qemu-images.sh

      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的QEMU管理地址是: ${{ github.event.inputs.custom_router_ip }}"

      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: Enable Store integration
        run: |
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Check Docker
        run: |
          if [[ "${{ inputs.include_docker }}" == "yes" ]]; then
             echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES docker"' >> shell/custom-packages.sh
             echo "✅ 已补充 docker 组件"
          fi

      - name: Building armsr-armv8 QEMU ImmortalWrt 25.12.x
        run: |
          profiles="${{ github.event.inputs.profile }}"
          rootfs_partsize="${{ github.event.inputs.rootfs_partsize }}"
          luci_version="${{ github.event.inputs.luci_version }}"
          
          IFS=',' read -r -a profile_array <<< "$profiles"
          
          for profile in "${profile_array[@]}"; do
            echo "Building for profile: $profile"
            
            docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
              -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
              -v "${{ github.workspace }}/arch/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
              -v "${{ github.workspace }}/armsr-armv8/imm25.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/armsr-armv8/build.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=$profile \
              -e ROOTFS_PARTSIZE=$rootfs_partsize \
              -e INCLUDE_DOCKER=${{ inputs.include_docker }} \
              -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
              -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
              -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
              immortalwrt/imagebuilder:armsr-armv8-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh
          done

      - name: Prepare QEMU release images
        run: |
          ${{ github.workspace }}/armsr-armv8/prepare-qemu-images.sh \
            "${{ github.workspace }}/bin/targets/armsr/armv8" \
            "${{ github.workspace }}"
          echo "==== release images ===="
          ls -lh \
            ${{ github.workspace }}/*-squashfs-combined-efi.img.gz \
            ${{ github.workspace }}/*-squashfs-combined-efi.qcow2 \
            ${{ github.workspace }}/*-squashfs-combined-efi.vmdk \
            ${{ github.workspace }}/*-ext4-combined-efi.qcow2.gz \
            ${{ github.workspace }}/*-ext4-combined-efi.vmdk.gz

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/qemu-info.md <<EOF
          ## 📡 QEMU armsr-armv8 后台信息
          - ✳️ **平台**: armsr/armv8 (QEMU)
          - 🏠 **后台地址**: ${{ github.event.inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无（首次登录后建议设置）
          - 📦 **分区大小**: ${{ github.event.inputs.rootfs_partsize }} MB
          - 🔖 **版本**: ${{ github.event.inputs.luci_version }}
          - 💿 **固件文件**:
            - squashfs-combined-efi.img.gz
            - squashfs-combined-efi.qcow2
            - squashfs-combined-efi.vmdk
            - ext4-combined-efi.qcow2.gz
            - ext4-combined-efi.vmdk.gz
          EOF
          if [ "${{ github.event.inputs.include_docker }}" == "yes" ]; then
            echo -e "\n#### 默认带 docker" >> ${{ github.workspace }}/qemu-info.md
          else
            echo -e "\n#### 不带 docker" >> ${{ github.workspace }}/qemu-info.md
          fi

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: QEMU-25.12
          name: ImmortWrt-QEMU-armsr-armv8-25.12.x
          body_path: ${{ github.workspace }}/qemu-info.md
          files: |
            ${{ github.workspace }}/*-squashfs-combined-efi.img.gz
            ${{ github.workspace }}/*-squashfs-combined-efi.qcow2
            ${{ github.workspace }}/*-squashfs-combined-efi.vmdk
            ${{ github.workspace }}/*-ext4-combined-efi.qcow2.gz
            ${{ github.workspace }}/*-ext4-combined-efi.vmdk.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
